# Pinned refs only: a pinned URL never changes, so no refreshPeriod is needed.
# Bump the refs in .chezmoidata/versions.yaml (see bin/bump-versions).
[".oh-my-zsh"]
  type = "archive"
  url = "https://github.com/ohmyzsh/ohmyzsh/archive/{{ .versions.ohmyzsh }}.tar.gz"
  exact = true
  stripComponents = 1
[".oh-my-zsh/custom/plugins/zsh-autosuggestions"]
  type = "archive"
  url = "https://github.com/zsh-users/zsh-autosuggestions/archive/refs/tags/v{{ .versions.zshAutosuggestions }}.tar.gz"
  exact = true
  stripComponents = 1
[".oh-my-zsh/custom/plugins/zsh-syntax-highlighting"]
  type = "archive"
  url = "https://github.com/zsh-users/zsh-syntax-highlighting/archive/refs/tags/{{ .versions.zshSyntaxHighlighting }}.tar.gz"
  exact = true
  stripComponents = 1
[".oh-my-zsh/custom/themes/powerlevel10k"]
  type = "archive"
  url = "https://github.com/romkatv/powerlevel10k/archive/refs/tags/v{{ .versions.powerlevel10k }}.tar.gz"
  exact = true
  stripComponents = 1
[".config/iterm2/vscode-light.itermcolors"]
  type = "file"
  url = "https://raw.githubusercontent.com/tallpants/vscode-theme-iterm2/master/vscode-light.itermcolors"
  refreshPeriod = "168h"
[".config/iterm2/vscode.itermcolors"]
  type = "file"
  url = "https://raw.githubusercontent.com/tallpants/vscode-theme-iterm2/master/vscode.itermcolors"
  refreshPeriod = "168h"

# Agent skills, symlinked into ~/.claude/skills.
{{- $skills := list
  (list "vercel-react-best-practices" "vercel-labs/agent-skills" .versions.vercelAgentSkills "skills/react-best-practices")
  (list "vercel-composition-patterns" "vercel-labs/agent-skills" .versions.vercelAgentSkills "skills/composition-patterns")
  (list "grill-with-docs" "mattpocock/skills" .versions.mattpocockSkills "skills/engineering/grill-with-docs")
  (list "improve-codebase-architecture" "mattpocock/skills" .versions.mattpocockSkills "skills/engineering/improve-codebase-architecture") }}
{{- range $skills }}
{{- $name := index . 0 }}{{ $repo := index . 1 }}{{ $ref := index . 2 }}{{ $path := index . 3 }}
[".agents/skills/{{ $name }}"]
  type = "archive"
  url = "https://github.com/{{ $repo }}/archive/{{ $ref }}.tar.gz"
  exact = true
  stripComponents = {{ add 1 (len (splitList "/" $path)) }}
  include = ["*/{{ $path }}", "*/{{ $path }}/**"]
{{- end }}
