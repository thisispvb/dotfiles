# Pinned refs only: a pinned URL never changes, so no refreshPeriod is needed.
# Bump the refs in .chezmoidata/versions.yaml (see bin/bump-versions).
[".oh-my-zsh"]
  type = "archive"
  url = "https://github.com/ohmyzsh/ohmyzsh/archive/{{ .versions.ohmyzsh }}.tar.gz"
  exact = true
  stripComponents = 1
[".oh-my-zsh/custom/plugins/zsh-autosuggestions"]
  type = "archive"
  url = "https://github.com/zsh-users/zsh-autosuggestions/archive/refs/tags/v{{ .versions.zshAutosuggestions }}.tar.gz"
  exact = true
  stripComponents = 1
[".oh-my-zsh/custom/plugins/zsh-syntax-highlighting"]
  type = "archive"
  url = "https://github.com/zsh-users/zsh-syntax-highlighting/archive/refs/tags/{{ .versions.zshSyntaxHighlighting }}.tar.gz"
  exact = true
  stripComponents = 1
[".oh-my-zsh/custom/themes/powerlevel10k"]
  type = "archive"
  url = "https://github.com/romkatv/powerlevel10k/archive/refs/tags/v{{ .versions.powerlevel10k }}.tar.gz"
  exact = true
  stripComponents = 1
[".config/iterm2/vscode-light.itermcolors"]
  type = "file"
  url = "https://raw.githubusercontent.com/tallpants/vscode-theme-iterm2/master/vscode-light.itermcolors"
  refreshPeriod = "168h"
[".config/iterm2/vscode.itermcolors"]
  type = "file"
  url = "https://raw.githubusercontent.com/tallpants/vscode-theme-iterm2/master/vscode.itermcolors"
  refreshPeriod = "168h"
